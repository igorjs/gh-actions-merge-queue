  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build
        run: npm run build
      - name: Verify build succeeded
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "::error::Build failed - dist/index.js not found"
            exit 1
          fi
          echo "Build completed successfully"

  # validate-action:
  #   name: Validate action.yml
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - name: actionlint
  #       uses: rhysd/actionlint@v1
  #     - name: Validate action.yml
  #       run: |
  #         test -f action.yml || (echo "action.yml missing" && exit 1)
  #         grep -q "runs:" action.yml

  # This job is used as a required check in branch protection rules
  report-ci-status:
    name: Report CI Status
    runs-on: ubuntu-latest
    needs: [lint-check, build-check]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.test.result }}" == "failure" || "${{ needs.build.result }}" == "failure" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed successfully"
